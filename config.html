<!DOCTYPE html>
<html>
<head>
	<title>Config</title>
	<meta charset="UTF-8">
</head>
<body onload="load()">
	<br>
	<div style="width:19cap; text-align:center; text-align:center">
		<div id=output style="font-family:monospace; border:1px solid black; height:7cap; text-align:left; padding-left:6px"></div>
		<br>
		<div>
			<input type=button value="<" onclick="if (stack[0].left) output.innerHTML=stack[0].left()">
			<input type=button value=">" onclick="if (stack[0].right) output.innerHTML=stack[0].right()">	
			<input type=button value="v" onclick="if (stack[0].down) output.innerHTML=stack[0].down()">
			<input type=button value="+" onclick="if (stack[0].plus) output.innerHTML=stack[0].plus()">	
			<input type=button value="-" onclick="if (stack[0].minus) output.innerHTML=stack[0].minus()">
			<input type=button value="^" onclick="if (stack[0].up) output.innerHTML=stack[0].up()">
		</div>
	</div>
	<script src="httpRequest.js"></script>
	<script>
		var progs, perc=100, delay=0
		var maxProg = 8, maxStation = 8
		var local = false
		function load() {
			httpRequest({
				method:'get', url:'server.py?load', async:false,
				onload: function () {
					try {
						eval(this.responseText.slice(this.responseText.indexOf('progs')))
						push(PPDTS)
						push(P, progs)
						if (Object.keys(progs).length == 1)	stack[0].down()
					}
					catch (e) {
						alert(`load error₁: ${e}`) 
					}
				},
				onerror: function (e) { alert(`load error₂: ${e.type}`) }
			}).send()
		}
		function save() {
			var s = '\nfrom datetime import time as hm\ndef sm(s, m): return [s, m]\n\n'
			s += 'progs = {\n'
			for (p in progs) s += '\t\'' + p + '\': ' + serialize(progs[p]) + ',\n'
			s += '}\n'
			s += 'perc = ' + perc + '\n'
			s += 'delay = ' + delay + '\n'
			httpRequest({
				method:'post', url:'server.py?save', async:false, body:s,
				onload: function (e) { alert(this.responseText) },
				onerror: function (e) { alert(`save error: ${e.type}`) },					
			}).send()
		}
		function serialize(o) {
			switch (typeof o) {
				case 'string': 
					return '\'' + o + '\''
				case 'object': 
					if (o === null) return 'null'
					if (o instanceof HM) return 'hm(' + o[0] + ',' + o[1] + ')'
					if (o instanceof SM) return 'sm(' + o[0] + ',' + o[1] + ')'
					if (Array.isArray(o)) {
						var s = '';
						for (var i in o) s += sp(s, ', ') + serialize(o[i]); 
						return '[' + s + ']'
					}
					var s = '';
					for (var k in o) s += sp(s, ', ') + serialize(k) + ':' + serialize(o[k]); 
					return '{' + s + '}'
				default:
					return o.toString()	
			}
		}
		var pid = {}
		function start(p, s, a, i) {
			var ps = p + (s ? ' ' : '') + s
			httpRequest({
				method:'get', url:'server.py?start ' + ps, async:false,
				onload: function () { a[i]=1; pid[ps] = this.responseText; },
				onerror: function (e) { alert(`start error: ${e.type}`) },
			}).send()
			if (!pid[ps] || !isNaN(p)) return
			httpRequest({
				method:'get', url:'server.py?wait ' + pid[ps], async:true,
				onload: function () { delete pid[ps]; a[i]=0; if (stack[0] instanceof M && stack[0].p == p) output.innerHTML = stack[0].value() },
				onerror: function (e) { delete pid[ps]; a[i]=0; alert(`wait error: ${e.type}`); },
			}).send()
		}
		function stop(p, s, a, i) {
			var ps = p + (s ? ' ' : '') + s
			if (!pid[ps]) return
			httpRequest({
				method:'get', url:'server.py?stop ' + pid[ps] + ' ' + ps, async:false,
				onload: function () { delete pid[ps]; a[i]=0 },
				onerror: function (e) { delete pid[ps]; a[i]=0; alert(`stop error: ${e.type}`); },
			}).send()
		}
		
		stack = []
		function push(t, ... a) {
			stack.unshift(obj = new t(... a))
			return output.innerHTML = obj.value()
		}
		function pop(v) {
			stack.shift()
			if (stack.length == 0) return v 
			if (v !== undefined) stack[0].set(v)
			return stack[0].value()
		}
		
		function I(ck, val) {
			var [min, max, step=1] = typeof ck == 'number' ? [0, ck] : ck
			var i = val || min
			this.plus  = ()=> i = i < max ? i + step : min
			this.minus = ()=> i = i > min ? i - step : max 
			this.value = ()=> i
			this.up    = ()=> pop(i)
		}

		function sp(b, sp) { return b ? sp : '' }
		function ub(a, i, m) {
			if (a instanceof HM)
				return u(i==0, a[0]) + ':' + u(i==1, a[1])
			if (a instanceof SM)
				return u(i==0, 's' + a[0]) + '-' + u(i==1, a[1] + '\'')
				
			s = ''
			if (!m)
				for (ii in a) s += sp(s, ' ') + u(ii == i, a[ii])
			else if (typeof m == 'string')
				for (ii in a) s += sp(s, ' ') + u(ii == i, b(a[ii] == m, a[ii]))
			else
				for (ii in a) s += sp(s, ' ') + u(ii == i, b(a[ii], m[ii]))
			return s
			
			function u(b, v) { return b ? '<u>' + v + '</u>' : v }
			function b(b, v) { return b ? '<b style=font-size:larger>' + v + '</b>' : v }
		}
		
		function AI(ck, df, a, m) {
			if (!a) a = df
			var max = a.length - 1
			var i = 0
			if (!Array.isArray(ck) || ck.length != a.length) ck = Array(a.length).fill(ck) 
			this.left  = ()=> ub(a, i = i > 0 ? i - 1 : max, m)
			this.right = ()=> ub(a, i = i < max ? i + 1 : 0, m)
			this.value = ()=> ub(a, i, m)
			this.plus  = ()=> { var [min, max] = ((ck)=> typeof ck == 'number' ? [0, ck] : ck)(ck[i]); a[i] = ((v)=> v < max ? v + 1 : min)(a[i]); return ub(a, i, m) }
			this.minus = ()=> { var [min, max] = ((ck)=> typeof ck == 'number' ? [0, ck] : ck)(ck[i]); a[i] = ((v)=> v > min ? v - 1 : max)(a[i]); return ub(a, i ,m) }
			this.up    = ()=> pop(a)
		}
		function AAI(ck, df, des, a) {
			if (!a) a = [df]
			a.sort((a, b)=> a[0] - b[0])
			var max = a.length - 1
			var i = 0
			this.left  = ()=> des + ub(a, i = i > 0 ? i - 1 : max)
			this.right = ()=> des + ub(a, i = i < max ? i + 1 : 0)
			this.value = ()=> des + ub(a,i)
			this.plus  = ()=> {	max += 1; a = a.toSpliced(i, 0, undefined); return this.down() }
			this.minus = ()=> { if (max > -1) max-=1; a = a.toSpliced(i, 1); if (i > max && i > 0) i-=1; return ub(a, i) }
			this.down  = ()=> push(AI, ck, df.slice(), a[i])
			this.up    = ()=> pop(a)
			this.set   = (v)=> { a[i] = v; a.sort((a, b)=> a[0] - b[0]); i = a.indexOf(v) }
		}
		
		class HM extends Array {
			constructor () { super(... arguments) }
			toString() { return this[0] + ':' + ('0' + this[1]).slice(-2) }	
		}
		function hm(h, m) { return new HM(h, m) }
		class SM extends Array {
			constructor () { super(... arguments) }
			toString() { return 's' + this[0] + '-' + this[1] +'\'' }	
		}
		function sm(s, m) { return new SM(s, m) }
		
		function P(o) {
			var a = Object.keys(o)
			a.sort()
			var max = a.length - 1
			var i = 0
			des = 'programs<br>'
			this.left  = ()=> des + ub(a, i = i > 0 ? i - 1 : max)
			this.right = ()=> des + ub(a, i = i < max ? i + 1 : 0)
			this.value = ()=> des + ub(a, i)
			this.plus  = ()=> {
				var prog=[]; for (var j=0; j<maxProg; j+=1) prog.push(String.fromCharCode(97+j));
				for (var p of prog) if (!(p in o)) {
					o[p] = []; a = Object.keys(o); a.sort(); max = a.length - 1; i = a.indexOf(p)
					break
				}
				return des + ub(a, i)
			}
			this.minus = ()=> {
				var p = a[i]; delete o[p]
				a = Object.keys(o); a.sort(); max -= 1; if (i > max) i--
				return des + ub(a, i)
			}
			this.down  = ()=> push(GOD, a[i], o[a[i]])
			this.up    = ()=> stack.length == 1 ? (save(), des + ub(a, i)) : pop()  
			this.up    = ()=> pop()  
			this.set   = (v)=> o[a[i]] = v
		}
		function GOD(p, god) {
			var a = ['howOften', 'startTime', 'runTime', 'manual']
			var max = a.length - 1
			var i = 0
			this.left  = ()=> ub(a, i = i > 0 ? i - 1 : max)
			this.right = ()=> ub(a, i = i < max ? i + 1 : 0)
			this.value = ()=> ub(a, i)
			this.down  = ()=> {
				switch (i) {
					case 0: return push(D, god[i])
					case 1: return push(AAI, [23,59], hmDef(), a[i] + '<br>', god[i])
					case 2: return push(AAI, [[1,maxStation], [1,60]], sm(1,1), a[i] + '<br>', god[i])
					case 3: return push(M, p, a[i] + '<br>', god[2])
				}
			}
			this.up    = ()=> pop(god)
			this.set   = (v)=> god[i] = v
			function hmDef() { var date = new Date(); return new HM(date.getHours(), date.getMinutes()) }
		}
		function PPDTS() {
			var a = ['programs', '%', 'delay', 'test', 'save']
			var max = a.length - 1
			var i = 0
			this.left  = ()=> ub(a, i = i > 0 ? i - 1 : max)
			this.right = ()=> ub(a, i = i < max ? i + 1 : 0)
			this.value = ()=> ub(a, i)
			this.down  = ()=> {
				switch (i) {
					case 0: return push(P, progs)
					case 1: return push(I, [10,150,10], perc)
					case 2: return push(I, [0,72], delay)
					case 3: return push(T)
					case 4: save(); return ub(a, i)
				}
			}
			this.up    = ()=> (save(), ub(a, i))
			this.set   = (v)=> { switch (i) { case 1: perc = v; break; case 2: delay=v; break; }}
		}
		var manual = {}
		function M(p, des, ds) {
			this.p = p
			if (p in manual && ds == manual[p].ds)
				var {m, a} = manual[p]
			else {
				manual[p] = { ds }
				ds.sort((a, b)=> a[0] - b[0])
				var m = []; for (d of ds) m.push('s' + d[0] + '-' + d[1] + '\''); m.unshift('all')
				var a = Array(1 + ds.length).fill(0)
				manual[p] = Object.assign(manual[p], {m, a})
			}
			var max = a.length - 1
			var i = 0
			this.left  = ()=> ub(a, i = i > 0 ? i - 1 : max, m)
			this.right = ()=> ub(a, i = i < max ? i + 1 : 0, m)
			this.value = ()=> ub(a, i, m)
			this.plus  = ()=> { if (!a[i] && (i && !a[0] || !i && !a.some(e=>e))) start(p, (!i ? '' : ds[i-1][0]), a, i); return ub(a, i, m) }
			this.minus = ()=> { if ( a[i]) stop(p, (!i ? '' : ds[i-1][0]), a, i); return ub(a, i, m) }
			this.up    = ()=> pop()
		}
		function D(o) {
			if (!o) o = ['every', 1]
			var a = ['every', 'dow', 'odd', 'even', 'o/e']
			var i = a.indexOf(o[0])
			var max = a.length - 1
			this.left  = ()=> ub(a, i = i > 0 ? i - 1 : max, o[0])
			this.right = ()=> ub(a, i = i < max ? i + 1 : 0, o[0])
			this.value = ()=> ub(a, i, o[0])
			this.down  = ()=> { 
				switch (i) {
					case 1: return push(AI, 1, [0,0,0,0,0,0,0], o[0] == 'dow' ? o.slice(1) : undefined, ['M', 'Tu', 'W', 'Th', 'F', 'Sa', 'Su'])
					case 0: return push(I, [1, 30], o[0] == 'every' ? o[1] : undefined)
					case 4: return push(I,  1, o[0] == 'o/e' ? o[1] : undefined)
					case 2:
					case 3: this.set([]); return ub(a, i, o[0])
				}
			}
			this.up    = ()=> pop(o)
			this.set   = (v)=> o = typeof v == 'number' ? [a[i], v] : [a[i], ... v]
		}
		function T() {
			var m = []; for (var i=1; i<=maxStation; i+=1) m.push('s' + i)
			var a = Array(m.length).fill(0)
			var max = a.length - 1
			var i = 0
			this.left  = ()=> ub(a, i = i > 0 ? i - 1 : max, m)
			this.right = ()=> ub(a, i = i < max ? i + 1 : 0, m)
			this.value = ()=> ub(a, i, m)
			this.plus  = ()=> { if (!a[i]) start(i+1, '', a, i); return ub(a, i, m) }
			this.minus = ()=> { if ( a[i])  stop(i+1, '', a, i); return ub(a, i, m) }
			this.up    = ()=> a.some(e=>e) ? ub(a, i, m) : pop()
		}
	</script>
</body>
